services:
  - type: web
    name: ultralob
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ULTRALOB_RENDER_MODE
        value: "true"
      - key: MARKET_DATA_MAX_CONNECTIONS
        value: "1"
      - key: PRICING_FALLBACK_MAX_PATHS
        value: "10000000"
      # Private deployment secrets & managed PostgreSQL (set values in Render Dashboard -> Environment)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        sync: false
      - key: ULTRALOB_JWT_SECRET
        sync: false
      - key: ULTRALOB_EXECUTION_ADMIN_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
