services:
  - type: web
    name: ultralob
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ULTRALOB_RENDER_MODE
        value: "true"
      - key: MARKET_DATA_MAX_CONNECTIONS
        value: "3"
      - key: PRICING_FALLBACK_MAX_PATHS
        value: "10000000"
