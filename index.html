<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UltraLOB — Institutional Strategy Allocation & Risk Infrastructure</title>
  <meta name="description" content="Institutional quantitative strategy allocation, portfolio risk governance, Monte Carlo stress testing, and MetaTrader 5 demo execution infrastructure.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b'
            },
            surface: {
              50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
              400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
              800: '#1e293b', 850: '#172033', 900: '#0f172a', 950: '#080d19'
            },
            profit: { DEFAULT: '#10b981', light: '#34d399', dark: '#059669', bg: 'rgba(16,185,129,0.1)' },
            loss: { DEFAULT: '#ef4444', light: '#f87171', dark: '#dc2626', bg: 'rgba(239,68,68,0.1)' },
            warn: { DEFAULT: '#f59e0b', bg: 'rgba(245,158,11,0.1)' }
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
            'count': 'count 1.5s ease-out forwards'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            slideDown: { '0%': { opacity: '0', transform: 'translateY(-10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            glow: { '0%': { boxShadow: '0 0 20px rgba(99,102,241,0.15)' }, '100%': { boxShadow: '0 0 40px rgba(99,102,241,0.3)' } }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #060a13; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .glass { background: rgba(15,23,42,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(99,102,241,0.08); }
    .glass-card { background: rgba(15,23,42,0.5); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,0.06); transition: all 0.3s ease; }
    .glass-card:hover { border-color: rgba(99,102,241,0.2); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .gradient-text { background: linear-gradient(135deg, #818cf8 0%, #6366f1 50%, #4f46e5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-border { position: relative; }
    .gradient-border::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(129,140,248,0.1), rgba(99,102,241,0.3)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    .hero-glow { background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.15), transparent); }
    .stat-card { background: linear-gradient(135deg, rgba(15,23,42,0.8) 0%, rgba(23,32,51,0.6) 100%); }
    .btn-primary { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); transition: all 0.2s ease; }
    .btn-primary:hover { background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.4); }
    .btn-outline { border: 1px solid rgba(99,102,241,0.3); transition: all 0.2s ease; }
    .btn-outline:hover { border-color: #6366f1; background: rgba(99,102,241,0.1); }
    .chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
    .chip-green { background: rgba(16,185,129,0.15); color: #34d399; }
    .chip-red { background: rgba(239,68,68,0.15); color: #f87171; }
    .chip-blue { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .chip-yellow { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .page-transition { animation: fadeIn 0.3s ease-out; }
    .nav-link { position: relative; }
    .nav-link.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: #6366f1; border-radius: 1px; }
    .mobile-menu { transform: translateX(100%); transition: transform 0.3s ease; }
    .mobile-menu.open { transform: translateX(0); }
    .sparkline { display: inline-block; }
    @media (max-width: 768px) { .hide-mobile { display: none !important; } }
  </style>
</head>
<body class="font-sans min-h-screen antialiased">
  <!-- App Root -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav id="navbar-container"></nav>
    <!-- Main Content -->
    <main id="page-content" class="flex-1"></main>
    <!-- Footer -->
    <div id="footer-container"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="window.__closeMobileMenu?.()"></div>
  <div id="mobile-menu" class="mobile-menu fixed top-0 right-0 h-full w-72 bg-surface-900 z-50 p-6 shadow-2xl"></div>

  <script type="module" src="/public/js/app.js"></script>
</body>
</html>
